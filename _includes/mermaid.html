<script type="module">
  const codes = document.querySelectorAll('code.language-mermaid, .language-mermaid code');
  if (!codes.length) {
    return;
  }
  const seen = new Set();
  for (const code of codes) {
    if (seen.has(code)) continue;
    seen.add(code);
    const pre = document.createElement('pre');
    pre.className = 'mermaid';
    pre.textContent = code.textContent;
    const wrap = code.closest('.language-mermaid') || code.closest('pre') || code;
    wrap.replaceWith(pre);
  }
  const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@12.3.0/dist/mermaid.esm.min.mjs');
  const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({
    startOnLoad: false,
    theme: dark ? 'dark' : 'default',
    themeVariables: {
      fontFamily: '"Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK KR", sans-serif',
    },
  });
  await mermaid.run({ querySelector: 'pre.mermaid' });
</script>
